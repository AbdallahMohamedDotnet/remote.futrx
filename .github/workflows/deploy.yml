# Push to main → fast-path code deploy.
#
# Pulls latest, rebuilds frontend + backend, restarts the backend service,
# health-checks it. Takes ~25s. Does NOT touch Caddy, host packages,
# code-server, systemd unit, or LXD. For those, run the `installer` workflow
# (.github/workflows/installer.yml).
#
# Secrets required:
#   SSH_KEY      private OpenSSH key authorized on $DEPLOY_HOST as $DEPLOY_USER
#   KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`
#   DEPLOY_HOST  hostname or IP for SSH connectivity (can be a raw IP)
#   DEPLOY_USER  ssh user (root for our setup)

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          echo "Deploying ${GITHUB_SHA::7} (${GITHUB_REF_NAME}) → ${DEPLOY_USER}@${DEPLOY_HOST}"
          echo

          ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=30 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "bash -se" <<'REMOTE'
          set -euo pipefail
          cd /opt/remote.futrx

          echo "==> git fetch + fast-forward to origin/main"
          git fetch --quiet --tags origin
          git reset --hard origin/main

          echo "==> frontend build"
          ( cd frontend && npm install --silent --no-audit --no-fund 2>&1 | tail -3 && npm run build 2>&1 | tail -5 )

          echo "==> backend build"
          ( cd backend && go build -trimpath -ldflags="-s -w" -o remote ./cmd/remote )

          echo "==> restart backend"
          systemctl restart remote.futrx
          sleep 1
          systemctl is-active --quiet remote.futrx || {
              echo "✗ service failed to start"
              journalctl -u remote.futrx -n 30 --no-pager
              exit 1
          }

          echo "==> health check"
          for _ in 1 2 3 4 5; do
              if curl -fsS --max-time 3 http://127.0.0.1:7682/ >/dev/null 2>&1; then
                  echo "✓ backend responding"
                  exit 0
              fi
              sleep 1
          done
          echo "✗ backend did not respond on 127.0.0.1:7682 within 5s"
          journalctl -u remote.futrx -n 30 --no-pager
          exit 1
          REMOTE

      - name: Summary
        if: success()
        run: echo "::notice ::Deployed ${GITHUB_SHA::7}"
