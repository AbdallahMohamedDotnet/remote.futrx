# Push to main → SSH into the production server → re-run the full installer.
#
# The installer at infra/install.sh is fully idempotent — its slow operations
# (apt update, snap install, etc.) skip themselves when their work is already
# done, so a CI deploy takes ~30s for a backend code change and only goes
# longer on the rare push that touches infra (new dep, code-server bump).
#
# This means EVERY push to main reconciles:
#   - host packages (apt/Caddy/Node/Go/claude/LXD)
#   - code-server install + config
#   - frontend + backend build
#   - Caddyfile (re-rendered from template)
#   - systemd units (re-rendered from templates)
#
# Secrets required (set via `gh secret set --repo Kings-Of-The-Web/remote.futrx.dev`):
#   SSH_KEY      private OpenSSH key authorized on $DEPLOY_HOST as $DEPLOY_USER
#   KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`
#   DEPLOY_HOST  hostname or IP of the server
#   DEPLOY_USER  ssh user (root for our setup)

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          echo "Deploying ${GITHUB_SHA::7} (${GITHUB_REF_NAME}) → ${DEPLOY_USER}@${DEPLOY_HOST}"
          echo

          # Heredoc with quoted EOF so the remote shell parses the body.
          # DEPLOY_HOST is passed via env so it's available inside the heredoc.
          ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=30 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "DEPLOY_HOST=${DEPLOY_HOST} bash -se" <<'REMOTE'
          set -euo pipefail
          cd /opt/remote.futrx.dev

          echo "==> git fetch + fast-forward to origin/main"
          git fetch --quiet --tags origin
          git reset --hard origin/main

          echo "==> running infra/install.sh ${DEPLOY_HOST} --skip-dns-check"
          # Full reconciliation. Idempotent ~30s on a typical backend code change;
          # longer only on infra changes (new system dep, code-server bump).
          bash infra/install.sh "${DEPLOY_HOST}" --skip-dns-check
          REMOTE

      - name: Summary
        if: success()
        run: echo "::notice ::Deployed ${GITHUB_SHA::7} to https://${{ secrets.DEPLOY_HOST }}"
