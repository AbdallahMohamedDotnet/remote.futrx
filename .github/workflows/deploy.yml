# Push to main → SSH into the production server → fast-path code deploy.
#
# Default ("fast path"): git pull + frontend & backend build + systemctl
# restart + health check. Takes ~25s. Does NOT touch Caddy, host packages,
# code-server, systemd unit, or LXD config — those are infra-level and only
# need to change when you edit infra/ in the repo.
#
# When you DO edit infra/ (Caddyfile.tmpl, a new host dep, code-server bump,
# etc.), trigger the deploy manually with `installer: true`:
#
#   gh workflow run deploy --field installer=true
#
# or via the Actions tab in GitHub. That runs the full infra/install.sh on
# the box and reconciles every dependency. Read infra/README.md for the
# step-by-step layout.
#
# Secrets required (set via `gh secret set --repo Kings-Of-The-Web/remote.futrx.dev`):
#   SSH_KEY      private OpenSSH key authorized on $DEPLOY_HOST as $DEPLOY_USER
#   KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`
#   DEPLOY_HOST  hostname or IP for SSH connectivity (can be a raw IP)
#   DEPLOY_USER  ssh user (root for our setup)
#
# PUBLIC_HOSTNAME is hardcoded below (NOT pulled from secrets): a typo in a
# secret silently swapping in $DEPLOY_HOST took the site down before. Fork
# users: change this string.

name: deploy

env:
  PUBLIC_HOSTNAME: remote.futrx.dev

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      installer:
        description: 'Re-run infra/install.sh on the box (picks up Caddy / host-dep / code-server changes)'
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RUN_INSTALLER: ${{ github.event.inputs.installer || 'false' }}
        run: |
          set -euo pipefail
          MODE="fast-path"
          [ "$RUN_INSTALLER" = "true" ] && MODE="full installer"
          echo "Deploying ${GITHUB_SHA::7} (${GITHUB_REF_NAME}) [$MODE] → ${DEPLOY_USER}@${DEPLOY_HOST}"
          echo

          # Heredoc with quoted EOF so the remote shell parses the body.
          ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=30 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "PUBLIC_HOSTNAME=${PUBLIC_HOSTNAME} RUN_INSTALLER=${RUN_INSTALLER} bash -se" <<'REMOTE'
          set -euo pipefail
          cd /opt/remote.futrx.dev

          echo "==> git fetch + fast-forward to origin/main"
          git fetch --quiet --tags origin
          git reset --hard origin/main

          if [ "${RUN_INSTALLER:-false}" = "true" ]; then
              echo "==> running full infra/install.sh ${PUBLIC_HOSTNAME} --skip-dns-check"
              bash infra/install.sh "${PUBLIC_HOSTNAME}" --skip-dns-check
              exit 0
          fi

          echo "==> frontend build"
          ( cd frontend && npm install --silent --no-audit --no-fund 2>&1 | tail -3 && npm run build 2>&1 | tail -5 )

          echo "==> backend build"
          ( cd backend && go build -trimpath -ldflags="-s -w" -o remote ./cmd/remote )

          echo "==> restart backend"
          systemctl restart remote.futrx.dev
          sleep 1
          systemctl is-active --quiet remote.futrx.dev || {
              echo "✗ service failed to start"
              journalctl -u remote.futrx.dev -n 30 --no-pager
              exit 1
          }

          echo "==> health check"
          for _ in 1 2 3 4 5; do
              if curl -fsS --max-time 3 http://127.0.0.1:7682/ >/dev/null 2>&1; then
                  echo "✓ backend responding"
                  exit 0
              fi
              sleep 1
          done
          echo "✗ backend did not respond on 127.0.0.1:7682 within 5s"
          journalctl -u remote.futrx.dev -n 30 --no-pager
          exit 1
          REMOTE

      - name: Summary
        if: success()
        run: echo "::notice ::Deployed ${GITHUB_SHA::7} to https://${{ env.PUBLIC_HOSTNAME }}"
