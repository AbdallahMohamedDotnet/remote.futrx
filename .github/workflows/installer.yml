# Manual full reconciliation — run when you edit anything under infra/
# (Caddyfile.tmpl, host deps, code-server bump, systemd unit, etc.).
#
# Trigger:
#   gh workflow run installer
# or via the Actions tab in GitHub → "installer" → Run workflow.
#
# This never fires on a push; only on workflow_dispatch. The default `deploy`
# workflow handles code changes (build + restart). Use this one when the
# behavior the box needs to converge to lives in `infra/`.
#
# Secrets required: same as deploy.yml (SSH_KEY, KNOWN_HOSTS, DEPLOY_HOST,
# DEPLOY_USER).
#
# PUBLIC_HOSTNAME below is the hostname Caddy serves on. It is hardcoded
# (NOT pulled from secrets) — a typo in a secret silently substituting in
# the SSH IP took the site down once. Fork users: change this string.

name: installer

env:
  PUBLIC_HOSTNAME: remote.futrx.dev

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run infra/install.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          echo "Reconciling ${GITHUB_SHA::7} (${GITHUB_REF_NAME}) → ${DEPLOY_USER}@${DEPLOY_HOST}"
          echo "Hostname for Caddy / cert issuance: ${PUBLIC_HOSTNAME}"
          echo

          ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=30 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "PUBLIC_HOSTNAME=${PUBLIC_HOSTNAME} bash -se" <<'REMOTE'
          set -euo pipefail
          cd /opt/remote.futrx.dev

          echo "==> git fetch + fast-forward to origin/main"
          git fetch --quiet --tags origin
          git reset --hard origin/main

          echo "==> bash infra/install.sh ${PUBLIC_HOSTNAME} --skip-dns-check"
          bash infra/install.sh "${PUBLIC_HOSTNAME}" --skip-dns-check
          REMOTE

      - name: Summary
        if: success()
        run: echo "::notice ::Full installer reconciled ${GITHUB_SHA::7} on ${{ env.PUBLIC_HOSTNAME }}"
